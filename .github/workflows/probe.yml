name: probe

on:
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: '[{"arch":"universalc1"},{"arch":"universalc2"}]'
    steps:
      - run: echo "detect ok"

  c1-dynamic-include:
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - run: echo "c1 dynamic-include arch=${{ matrix.arch }}"

  c2-static-include:
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: universal
    steps:
      - run: echo "c2 static-include arch=${{ matrix.arch }}"
